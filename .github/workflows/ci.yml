name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${secrets.DB_USER_ENCURTADOR}
          POSTGRES_PASSWORD: ${secrets.DB_PASSWORD_ENCURTADOR}
          POSTGRES_DB: url_shortener_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        env:
          DB_USER: ${secrets.DB_USER_ENCURTADOR}
          DB_PASSWORD: ${secrets.DB_PASSWORD_ENCURTADOR}
          DB_NAME: url_shortener_db
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CACHE_TTL_SECONDS: 3600
        run: |
          pytest tests/unit/ --cov=app.application --cov-fail-under=80 --cov-report=term-missing